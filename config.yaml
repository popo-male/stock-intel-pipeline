timezone: "Asia/Kuala_Lumpur" # Malaysia Time (GMT+8)

market:
  watchlist:
    - symbol: "AAPL"
      name: "Apple Inc."
      encoding: 0
    - symbol: "MSFT"
      name: "Microsoft Corporation"
      encoding: 1
    - symbol: "GOOGL"
      name: "Alphabet Inc."
      encoding: 2
    - symbol: "AMZN"
      name: "Amazon.com, Inc."
      encoding: 3
    - symbol: "NVDA"
      name: "NVIDIA Corporation"
      encoding: 4
    - symbol: "META"
      name: "Meta Platforms, Inc."
      encoding: 5
    - symbol: "TSLA"
      name: "Tesla, Inc."
      encoding: 6
  indices:
    - symbol: "SPY"
      name: "SPDR S&P 500 ETF Trust"
    - symbol: "QQQ"
      name: "Invesco QQQ Trust"

scraper:
  rss_base_url: "https://feeds.finance.yahoo.com/rss/2.0/headline?s={ticker}&region=US&lang=en-US"
  sleep_interval: 1
  max_workers: 4

nlp:
  sentiment_model: "ProsusAI/finbert"
  title_weight: 0.6
  summary_weight: 0.4
  bullish_threshold: 0.05
  bearish_threshold: -0.05

features:
  lookback_days: 20
  cold_start_rows: 20
  target_threshold_pct: 1.0 # +1% for UP, -1% for DOWN in multi-class
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9

target_definitions:
  up_code: 1
  down_code: 0
  direction_up: "UP"
  direction_down: "DOWN"
  direction_neutral: "NEUTRAL"

training:
  start_date: "2023-01-01"
  end_date: "2025-12-31"
  output_parquet: "data/training_dataset.parquet"
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

model:
  version: "v1.0.0"

logging:
  level: "INFO"
  name: "stock_intelligence_pipeline"
  path: "log/out.log"
